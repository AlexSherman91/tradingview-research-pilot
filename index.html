.lite-notebook{max-width:800px;margin:0 auto;padding:32px 24px 64px}
.lite-notebook .workspace-toolbar{margin-bottom:18px;gap:8px}
.lite-heading{padding:16px 0 28px}
.lite-heading h1{font-size:clamp(28px,4vw,38px);margin:0 0 18px}
.lite-companies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lite-company{display:flex;flex-direction:column;gap:4px;min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-decoration:none}
.lite-company strong{font-size:18px;line-height:1.2}
.lite-company span{font-size:13px;color:#5d606b;overflow-wrap:anywhere}
.lite-company:hover{border-color:#9598a1}
.lite-company[aria-current=page]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#f2f5ff}
.lite-company[aria-current=page] strong{color:var(--blue)}
.lite-section{padding:20px 0;border-top:1px solid var(--line)}
.lite-section h2,.lite-section label{margin-top:0}
.lite-section h2{margin-bottom:0}
.lite-section textarea{resize:vertical}
.lite-date{max-width:205px}
.lite-date .form-label{margin-bottom:0}
.lite-menu{position:relative}
.lite-menu summary,.lite-source summary{cursor:pointer}
.lite-menu summary{display:block;list-style:none;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:20px;color:var(--ink)}
.lite-menu button{position:absolute;right:0;top:calc(100% + 4px);background:white;border:1px solid var(--line);white-space:nowrap;z-index:1}
.lite-record{border-bottom:1px solid var(--line);padding:10px 0 14px}
.lite-record .panel-head{justify-content:space-between}
.lite-record .record-text{margin:4px 0 8px}
.lite-actions,.lite-meta{display:flex;align-items:center;gap:8px}
.lite-meta:empty{display:none}
.lite-source{margin:12px 0;color:var(--muted)}
.lite-source .form-label{margin-top:10px}
.lite-capture-context{margin-top:8px}
@media(max-width:540px){.lite-notebook{padding:20px 16px 44px}.lite-companies{gap:6px}.lite-company{padding:10px 8px}.lite-company strong{font-size:15px}.lite-company span{font-size:12px}.lite-notebook .workspace-toolbar{align-items:flex-start}}

function removeRecord(id){

  linked.forEach(argument=>argument.evidenceIds=argument.evidenceIds.filter(evidenceId=>evidenceId!==id));
  undoAction={symbol:doc.symbol,index,record,linked};
  const ok=save();render();notify(ok?'Observation removed.':'Removed in memory. Storage unavailable.',true);
}
function undoRemoval(){
  const {symbol,index,record,linked}=undoAction;
  const target=state.documents[symbol];
  target.evidence.splice(index,0,record);
  linked.forEach(argument=>argument.evidenceIds.push(record.id));
  target.updatedAt=new Date().toISOString();
  undoAction=null;
  const ok=writeState();render();notify(ok?'Observation restored.':'Restored in memory. Export a copy to keep it.');
}
function exportResearch(){const blob=new Blob([JSON.stringify({format:'tradingview-research-prototype',exportedAt:new Date().toISOString(),research:doc},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${doc.symbol}-research.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Research exported.');}
document.addEventListener('click',event=>{const action=event.target.closest('[data-action]');if(action){const name=action.dataset.action,id=action.dataset.id;if(name==='toggle-rail-widget'){const widget=document.getElementById('rail-research-widget');widget.hidden=!widget.hidden;action.setAttribute('aria-expanded',String(!widget.hidden));if(!widget.hidden){widget.querySelector('a')?.focus();}}else if(name==='close-rail-widget'){closeRailWidget(true);}else if(name==='outline-entry'){const active=document.querySelector('.reference-stage')?.classList.toggle('show-entry');action.setAttribute('aria-pressed',String(Boolean(active)));}else if(name==='close-modal')closeModal();else if(name==='add-evidence')openEvidence();else if(name==='edit-evidence')openEvidence(id);else if(name==='remove-evidence')removeRecord(id);else if(name==='export')exportResearch();else if(name==='undo'&&undoAction){undoRemoval();}return;}
if(!event.target.closest('#rail-research-widget'))closeRailWidget();const anchor=event.target.closest('a');if(anchor&&!event.metaKey&&!event.ctrlKey&&!event.shiftKey&&!event.altKey&&event.button===0&&anchor.getAttribute('href')?.startsWith('?')&&!anchor.target){event.preventDefault();go(anchor.getAttribute('href'));return;}const products=document.querySelector('.products');if(products&&!products.contains(event.target))products.open=false;});
document.addEventListener('input',event=>{const field=event.target.dataset.model;if(field){doc[field]=event.target.value;save();}});
document.addEventListener('change',event=>{
  const field=event.target;
  if(field.type==='date'&&field.dataset.model){doc[field.dataset.model]=field.value;save();}
});
document.addEventListener('submit',event=>{
  if(event.target.id!=='editor-form'||!modal)return;
  event.preventDefault();
  const form=event.target;
  const data=Object.fromEntries(new FormData(form));
  const url=safeUrl(data.source);
  const observation=data.observation.trim();
  const sourceInput=form.elements.source;
  const observationInput=form.elements.observation;
  if(!observation){
    observationInput.setCustomValidity('Enter an observation.');
    observationInput.addEventListener('input',()=>observationInput.setCustomValidity(''),{once:true});
    observationInput.reportValidity();return;
  }
  if(data.source.trim()&&!url){
    sourceInput.closest('details').open=true;
    sourceInput.setCustomValidity('Use an HTTP or HTTPS source URL.');
    sourceInput.addEventListener('input',()=>sourceInput.setCustomValidity(''),{once:true});
    sourceInput.reportValidity();return;
  }
  const {id,sourceName,returnToSource}=modal;
  const index=doc.evidence.findIndex(record=>record.id===id);
  const old=doc.evidence[index];
  const record={...old,id:id||uid(),observation,stance:data.stance,metric:data.metric.trim(),
    period:data.period.trim(),source:url,sourceName,createdAt:old?.createdAt||new Date().toISOString()};
  if(old)doc.evidence[index]=record;
  else doc.evidence.push(record);
  closeModal();
  const ok=save();
  if(ok&&returnToSource)go(surfaceUrl('community'),true);
  else render();
  notify(ok?'Observation saved.':'Saved in memory. Storage unavailable; export a copy.');
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(document.getElementById('rail-research-widget')?.hidden===false){closeRailWidget(true);return;}const products=document.querySelector('.products');if(products?.open){products.open=false;document.querySelector('.menu-trigger').focus();}}});
document.addEventListener('cancel',event=>{if(event.target.id==='editor-dialog')closeModal();},true);
window.addEventListener('popstate',()=>{modal=null;render();});
render();
</script></body></html>
