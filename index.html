function header(){return `<header class="top"><a class="brand" href="?" aria-label="TradingView — home">${logo}TradingView</a><a class="search" href="https://www.tradingview.com/search/" target="_blank" rel="noopener" aria-label="Search on TradingView">${icon('search')}<span>Search</span><kbd>⌘ K</kbd></a><nav class="mainnav" aria-label="Main navigation"><details class="products"><summary class="menu-trigger">Products ${icon('chevron')}</summary><div class="product-menu"><div class="menu-label">MARKET ANALYSIS</div><a class="product-item" href="${surfaceUrl('chart')}">${icon('chart')}<div><strong>Supercharts</strong><small>Chart context and existing symbol notes</small></div></a><a class="product-item" href="${surfaceUrl('financials')}">${icon('screener')}<div><strong>Financials</strong><small>Capture a metric with its period and source</small></div></a><a class="product-item" href="${surfaceUrl('filings')}">${icon('notebook')}<div><strong>Filings</strong><small>Connect company disclosures to your thesis</small></div></a><a class="product-item" href="${surfaceUrl('watchlist')}">${icon('calendar')}<div><strong>Watchlist & screeners</strong><small>Open or revisit research on a company</small></div></a><a class="product-item featured" href="${routeUrl('brief')}">${icon('notebook')}<div><strong>Research notebook <span class="new">Pilot</span></strong><small>Evidence, thesis and conditions for review</small></div></a></div></details><a class="navlink research-nav" href="${routeUrl('brief')}">Research <span class="new">Pilot</span></a><a class="navlink optional-nav" href="https://www.tradingview.com/ideas/" target="_blank" rel="noopener">Community</a><a class="navlink optional-nav" href="https://www.tradingview.com/markets/" target="_blank" rel="noopener">Markets</a><a class="navlink optional-nav" href="https://www.tradingview.com/brokers/" target="_blank" rel="noopener">Brokers</a></nav><div class="header-end"><span class="language">${icon('globe')} EN</span><span class="avatar" aria-label="Demo profile">A</span><a class="button getstarted" href="https://www.tradingview.com/pricing/" target="_blank" rel="noopener"><span>Get started</span></a></div></header>`;}
function home(){return `<div class="home">${header()}<main class="hero"><video class="earth" autoplay muted loop playsinline poster="https://static.tradingview.com/static/bundles/earth-blurred.0375ae5d4a11366fb585.webp" aria-hidden="true"><source src="https://static.tradingview.com/static/bundles/earth.avc1.f6a145c79bffd1ef7941.mp4" type="video/mp4"></video><h1>Where the world does markets</h1><p>Join 100 million traders and investors taking the future into their own hands.</p><a class="button hero-cta" href="https://www.tradingview.com/pricing/" target="_blank" rel="noopener"><span>Get started for free</span></a><p class="fine">$0 forever, no credit card needed</p><a class="entry-hint" id="entry-hint" href="${routeUrl('brief')}">${icon('notebook')} Open Research notebook <span class="new">Pilot</span> →</a><div class="home-note">DEMONSTRATION PROTOTYPE · PROPOSED RESEARCH WORKSPACE</div></main></div>`;}
function productTabs(){return `<nav class="tabs" aria-label="Company products">${[['overview','Overview'],['financials','Financials'],['filings','Filings'],['chart','Supercharts'],['watchlist','Watchlist']].map(([key,label])=>`<a href="${surfaceUrl(key)}" ${route.surface===key?'class="selected" aria-current="page"':''}>${label}</a>`).join('')}<a href="${routeUrl('brief')}" ${!route.surface?'class="selected" aria-current="page"':''}>Research <span class="new">Pilot</span></a></nav>`;}
function companySelect(){return `<label class="company-switch"><span class="sr-only">Research company</span><select id="company-switch">${Object.keys(companyNames).map(s=>selectedOption(s,s+' · '+companyNames[s],route.symbol)).join('')}</select></label>`;}
function sidebar(){const c=counts();return `<aside class="sidebar"><a class="eyebrow library-link" href="${surfaceUrl('watchlist')}">← MY RESEARCH</a>${companySelect()}<div class="small sidebar-question">${esc(doc.question)}</div><nav class="sections" aria-label="Research sections">${sections.map(([key,label,i])=>`<a class="section-link ${key===route.view?'active':''}" href="${routeUrl(key)}" ${key===route.view?'aria-current="page"':''}>${icon(i)}<span>${label}</span>${key==='evidence'?`<span class="section-count">${doc.evidence.length}</span>`:key==='questions'?`<span class="section-count">${c.open}</span>`:''}</a>`).join('')}</nav><div class="sidebar-links"><div class="eyebrow">SOURCE WORKSPACE</div><a href="${surfaceUrl('financials')}">Financials ↗</a><a href="${surfaceUrl('filings')}">Filings ↗</a><a href="${surfaceUrl('chart')}">Supercharts & Notes ↗</a></div><div class="prototype-note">PILOT CONCEPT<br>Local research, stored in this browser.<br>Sample entries are labelled.</div></aside>`;}
function brief(){const c=counts();return `<div class="research-banner"><div><span class="badge">${esc(doc.status)}</span><h1>${esc(doc.title)}</h1><div class="small">${esc(companyNames[doc.symbol])} · NASDAQ · ${esc(doc.horizon==='Custom'?(doc.customHorizon||'Custom horizon'):doc.horizon)}</div></div><a class="button primary" href="${routeUrl('evidence')}&capture=manual">+ Add evidence</a></div><div class="stat-strip"><a href="${routeUrl('evidence')}"><strong>${c.evidence}</strong> sourced records</a><a href="${routeUrl('questions')}"><strong>${c.open}</strong> open questions</a><a href="${routeUrl('risks')}"><strong>${c.risks}</strong> risks & alternatives</a><a href="${routeUrl('thesis')}"><strong>${esc(doc.reviewDate||'Not set')}</strong> next review</a></div><div class="work-cols"><section class="card"><h2>Research brief</h2>${modelField('Research title','title',doc.title,'text','maxlength="140"')}${modelField('Research question','question',doc.question,'textarea','rows="2" maxlength="600"')}<label class="form-label">Time horizon<select data-model="horizon">${['One quarter','1–3 years','3–5 years','Custom'].map(h=>selectedOption(h,h,doc.horizon)).join('')}</select></label>${doc.horizon==='Custom'?modelField('Custom time horizon','customHorizon',doc.customHorizon||'','text','maxlength="120" placeholder="e.g. Through the next two earnings releases"'):''}</section><section class="card"><div class="panel-head"><h2>Current thesis</h2><a class="text-link" href="${routeUrl('thesis')}">Edit ↗</a></div>${doc.thesis?`<p class="thesis-preview">${esc(doc.thesis)}</p>`:'<div class="empty-state"><strong>No thesis recorded yet</strong><p>Keep a working view here while the evidence changes.</p><a class="text-link" href="'+routeUrl('thesis')+'">Write a thesis →</a></div>'}<div class="divider"></div><h3>Open research</h3>${doc.questions.filter(q=>q.status==='Open').slice(0,3).map(q=>`<a class="simple-row" href="${routeUrl('questions')}"><span>${esc(q.title)}</span><span class="badge">Open</span></a>`).join('')||'<p class="small">No open questions.</p>'}</section></div><div class="note-line">Evidence and question counts describe this document. They do not score the strength of your thesis.</div>`;}
function questions(){return `<div class="section-heading"><div><h1>Open questions</h1><p class="subtitle">Your research backlog. Add, revise or drop questions as the thesis changes.</p></div><button class="primary" data-action="add-question">+ Add question</button></div><section class="card question-list">${doc.questions.map(q=>{const linked=doc.evidence.filter(e=>e.questionId===q.id);return `<div class="question-row"><div><strong>${esc(q.title)}</strong><div class="small">${linked.length} linked record${linked.length===1?'':'s'}${linked.some(e=>e.sample)?' · includes sample':''}</div></div><label><span class="sr-only">Status for ${esc(q.title)}</span><select data-question-status="${q.id}">${['Open','Supported','Mixed','Contradicted','Not relevant'].map(s=>selectedOption(s,s,q.status)).join('')}</select></label><button class="icon-button" data-action="edit-question" data-id="${q.id}" aria-label="Edit ${esc(q.title)}">Edit</button><button class="icon-button" data-action="remove-question" data-id="${q.id}" aria-label="Remove ${esc(q.title)}">×</button></div>`;}).join('')||'<div class="empty-state">No questions in this research.</div>'}</section><div class="note-line">Statuses reflect your assessment. Adding a record does not automatically mark a question as supported.</div><div class="source-shortcuts"><a class="button" href="${surfaceUrl('financials')}">Open Financials ↗</a><a class="button" href="${surfaceUrl('filings')}">Open Filings ↗</a></div>`;}
function evidenceCard(e){const q=doc.questions.find(q=>q.id===e.questionId);return `<article class="evidence-card"><div class="panel-head"><div class="record-meta"><span class="badge ${e.sample?'sample':''}">${e.sample?'Sample · illustrative':esc(e.sourceName||'Manual record')}</span><span>${esc(e.metric||'Observation')}</span></div><button class="icon-button" data-action="edit-evidence" data-id="${e.id}" aria-label="Edit evidence: ${esc(e.metric||'Observation')}">Edit</button></div><p class="record-text">${esc(e.observation)}</p><div class="record-foot"><span>${esc(e.period||'Period not specified')}</span>${sourceLink(e.source,'Source ↗')}</div><div class="record-foot"><span>${q?'Linked to: '+esc(q.title):'No question linked'}</span><button class="icon-button" data-action="remove-evidence" data-id="${e.id}" aria-label="Remove evidence: ${esc(e.metric||'Observation')}">Remove</button></div></article>`;}
function evidence(){return `<div class="section-heading"><div><h1>Evidence</h1><p class="subtitle">Observations with source, period and a link to the question they address.</p></div><button class="primary" data-action="add-evidence">+ Add evidence</button></div><div class="evidence-toolbar"><label>Filter by question<select id="evidence-filter"><option value="">All questions</option>${questionOptions('',false)}</select></label><div class="source-shortcuts"><a href="${surfaceUrl('financials')}" class="button">Financials ↗</a><a href="${surfaceUrl('filings')}" class="button">Filings ↗</a><a href="${surfaceUrl('chart')}" class="button">Supercharts ↗</a></div></div><div id="evidence-list">${doc.evidence.map(evidenceCard).join('')||'<div class="card empty-state"><strong>No evidence yet</strong><p>Add an observation or capture context from Financials, Filings or Supercharts.</p></div>'}</div>`;}
function argumentCard(a){const isRisk=['Risk','Alternative'].includes(a.side);return `<article class="evidence-card argument-card ${isRisk?'risk-card':''}"><div class="panel-head"><span class="badge ${a.sample?'sample':''}">${esc(a.side)}${a.sample?' · sample':''}</span><button class="icon-button" data-action="edit-argument" data-id="${a.id}" aria-label="Edit argument: ${esc(a.side)}">Edit</button></div><p class="record-text">${esc(a.text)}</p><div class="linked-evidence">${a.evidenceIds.map(id=>doc.evidence.find(e=>e.id===id)).filter(Boolean).map(e=>`<a href="${routeUrl('evidence')}">↳ ${esc(e.metric||'Observation')}${e.sample?' · sample':''}</a>`).join('')||'<span class="small">No evidence linked · assumption</span>'}</div><div class="record-foot"><span>${isRisk?'Revisit in the thesis review':'User assessment'}</span><button class="icon-button" data-action="remove-argument" data-id="${a.id}">Remove</button></div></article>`;}
function assessment(){return `<div class="section-heading"><div><h1>Assessment</h1><p class="subtitle">Your interpretation of the evidence, with supporting and conflicting records kept visible.</p></div><button class="primary" data-action="add-argument">+ Add argument</button></div><div class="assessment-grid">${['Supports','Challenges','Open issue'].map(side=>`<section><h2 class="column-heading">${side}<span>${doc.arguments.filter(a=>a.side===side).length}</span></h2>${doc.arguments.filter(a=>a.side===side).map(argumentCard).join('')||'<div class="empty-column">No arguments recorded.</div>'}</section>`).join('')}</div>`;}
function risks(){return `<div class="section-heading"><div><h1>Risks & alternatives</h1><p class="subtitle">Conditions that could change your view, separate from the observations themselves.</p></div><button class="primary" data-action="add-risk">+ Add risk or alternative</button></div><div class="work-cols">${['Risk','Alternative'].map(side=>`<section><h2 class="column-heading">${side==='Risk'?'Risks':'Alternative explanations'}<span>${doc.arguments.filter(a=>a.side===side).length}</span></h2>${doc.arguments.filter(a=>a.side===side).map(argumentCard).join('')||'<div class="card empty-state">No '+(side==='Risk'?'risks':'alternatives')+' recorded.</div>'}</section>`).join('')}</div><a class="button" href="${surfaceUrl('filings')}">Review company disclosures ↗</a>`;}
function thesis(){return `<div class="section-heading"><div><h1>Thesis & review</h1><p class="subtitle">A working view with explicit limits and a date to revisit it.</p></div><button class="primary" data-action="save-thesis">Save thesis</button></div><div class="work-cols"><section class="card">${modelField('Working thesis','thesis',doc.thesis,'textarea','rows="5" placeholder="Record your current view and its basis…" maxlength="8000"')}${modelField('Limitations and missing evidence','limitations',doc.limitations,'textarea','rows="3" placeholder="What remains uncertain?" maxlength="5000"')}${modelField('What would change this thesis?','invalidation',doc.invalidation,'textarea','rows="3" placeholder="A specific observation or event…" maxlength="5000"')}</section><aside class="card"><h2>Review settings</h2><label class="form-label">Research status<select data-model="status">${['Draft','Under review','Active thesis','Archived'].map(s=>selectedOption(s,s,doc.status)).join('')}</select></label>${modelField('Review date','reviewDate',doc.reviewDate,'date')}<p class="small">Stored in this notebook. No calendar event or notification is created.</p><div class="divider"></div><h3>Document context</h3><p class="small">${doc.evidence.filter(e=>!e.sample).length} sourced records · ${doc.evidence.filter(e=>e.sample).length} sample records<br>${counts().open} open questions · ${counts().risks} risks or alternatives</p>${doc.revisionAt?'<p class="small">Last explicit save: '+esc(new Date(doc.revisionAt).toLocaleString('en-GB'))+'</p>':''}<button class="button" data-action="export">Export research (.json)</button><p class="small">Private to this browser until you choose to share the exported file.</p></aside></div>`;}
function notebook(){return `${header()}${productTabs()}<div class="workspace">${sidebar()}<main class="content"><div class="workspace-toolbar"><nav class="crumb" aria-label="Breadcrumb"><a href="${surfaceUrl('watchlist')}">My research</a><span>›</span><span>${doc.symbol}</span><span>›</span><span>${sections.find(s=>s[0]===route.view)[1]}</span></nav><div class="save-tools"><span data-save-status role="status"></span><button class="icon-button" data-action="export">Export</button></div></div>${({brief,questions,evidence,assessment,risks,thesis})[route.view]()}<div class="workspace-foot">Research notebook <span class="new">Pilot</span><span>Local prototype · no live data import or account sync</span></div></main></div>`;}
function integrationCard(title,text,cta,url,action=''){return `<aside class="card integration-card"><div class="mini-eyebrow">RESEARCH NOTEBOOK <span class="new">Pilot</span></div><h2>${title}</h2><p>${text}</p>${action?`<button class="primary" data-action="${action}">${cta}</button>`:`<a class="button primary" href="${url}">${cta}</a>`}<a class="text-link" href="${routeUrl('brief')}">Open current research ↗</a></aside>`;}
function captureUrl(surface){return routeUrl('evidence')+'&capture='+surface;}
function productHeader(title,subtitle){return `<div class="section-heading"><div><div class="product-company">${doc.symbol} <span>${esc(companyNames[doc.symbol])} · NASDAQ</span></div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${companySelect()}</div>`;}
function financialsSurface(){return `${productHeader('Financial statements','Income statement · Quarterly')}<div class="product-columns"><section class="card source-preview"><div class="panel-head"><h2>Income statement</h2><a class="text-link" href="${liveUrl('financials')}" target="_blank" rel="noopener">Open live Financials ↗</a></div>${doc.symbol==='AAPL'?'<img class="reference-image" src="assets/financials.jpg" alt="Reference screenshot of Apple Financials in TradingView"><p class="small">Reference screenshot from the interface audit. It is not connected to the capture controls.</p>':'<div class="empty-state">Open the live source to review financial values.</div>'}<div class="capture-context"><h3>Selected source context</h3><label class="form-label">Metric<select id="capture-metric"><option>Total revenue</option><option>Net income</option><option>Operating cash flow</option></select></label><label class="form-label">Comparison period<select id="capture-period"><option>Q4 FY2026 vs Q4 FY2025</option><option>Q3 FY2026 vs Q3 FY2025</option><option>FY2025 vs FY2024</option></select></label><button class="primary" data-action="capture-financials">+ Add to research</button></div></section>${integrationCard('Keep the source with the observation','Capture the company, metric and comparison period. Add your observation before saving it to the evidence ledger.','Add an observation',captureUrl('financials'),'capture-financials')}</div>`;}
function filingsSurface(){return `${productHeader('SEC filings and company documents','Disclosures, reported drivers and risks')}<div class="product-columns"><section class="card"><div class="panel-head"><h2>Company documents</h2><a class="text-link" href="${liveUrl('filings')}" target="_blank" rel="noopener">Open live Filings ↗</a></div><div class="document-preview"><span class="badge">Source context · no document text imported</span><h2>Annual report · Form 10-K</h2><p>Review the company’s disclosures, then record a passage or observation with a source link.</p><label class="form-label">Document period<select id="filing-period"><option>FY2026</option><option>FY2025</option></select></label><label class="form-label">Document section<select id="filing-section"><option>Risk factors</option><option>Management discussion</option><option>Business overview</option></select></label><button class="primary" data-action="capture-filings">+ Add to research</button></div></section>${integrationCard('Connect disclosures to your thesis','Keep a passage, the document period and its source together. Distinguish a reported statement from your interpretation.','Capture a disclosure',captureUrl('filings'),'capture-filings')}</div>`;}
function chartSurface(){return `${productHeader('Supercharts · Notes','Proposed entry from the existing notes workflow')}<div class="product-columns"><section class="card"><div class="panel-head"><h2>${doc.symbol} · Chart workspace</h2><a class="text-link" href="${liveUrl('chart')}" target="_blank" rel="noopener">Open live Supercharts ↗</a></div><div class="chart-concept"><div class="chart-grid"><span>Chart remains in Supercharts</span><a class="button" href="${liveUrl('chart')}" target="_blank" rel="noopener">Open chart ↗</a></div></div><div class="existing-note"><div class="panel-head"><h3>${doc.symbol} notes</h3><span class="badge">Existing product surface</span></div><p class="small">Keep quick notes here. Open the linked research when the note needs evidence, an assessment or a review date.</p><a class="button primary" href="${routeUrl('brief')}">Open research ↗</a><a class="button" href="${captureUrl('chart')}">+ Add chart observation</a></div></section>${integrationCard('One research document per company','The research link sits beside Notes. The chart is a source workspace; the notebook holds your thesis and its evidence.','Open research',routeUrl('brief'))}</div>`;}
function overviewSurface(){return `${productHeader('Company overview','A company-level entry into the research you keep')}<div class="product-columns"><section class="card"><h2>${esc(companyNames[doc.symbol])}</h2><p class="small">Company overview is the discovery surface. Financial values remain on the live product.</p><div class="overview-links"><a href="${surfaceUrl('financials')}">${icon('chart')}<strong>Financials</strong><span>Statements and performance ↗</span></a><a href="${surfaceUrl('filings')}">${icon('notebook')}<strong>Filings</strong><span>Company disclosures ↗</span></a><a href="${surfaceUrl('chart')}">${icon('chart')}<strong>Supercharts</strong><span>Chart and symbol notes ↗</span></a></div><a class="text-link" href="${liveUrl('overview')}" target="_blank" rel="noopener">Open live company overview ↗</a></section>${integrationCard(doc.updatedAt?'Continue your research':'Research this company',doc.updatedAt?esc(doc.title):'Keep a working thesis, sourced observations and a review date for this company.',doc.updatedAt?'Continue research':'Open Research notebook',routeUrl('brief'))}</div>`;}
function watchlistSurface(){const isScreener=route.surface==='screener';return `${productHeader(isScreener?'Stock screener':'Watchlist & research','Company rows with a contextual research action')}<div class="card"><div class="panel-head"><h2>${isScreener?'Selected companies':'My companies'}</h2><a class="text-link" href="${surfaceUrl(isScreener?'watchlist':'screener')}">${isScreener?'Watchlist':'Screener'} preview ↗</a></div><div class="table-scroll"><table class="company-table"><thead><tr><th>Company</th><th>Research status</th><th>Review date</th><th>Action</th></tr></thead><tbody>${Object.entries(companyNames).map(([symbol,name])=>{const d=state.documents[symbol];return `<tr><td><strong>${symbol}</strong><div class="small">${name}</div></td><td>${d?.updatedAt?esc(d.status):'No saved research'}</td><td>${esc(d?.reviewDate||'—')}</td><td><a class="button ${symbol===doc.symbol?'primary':''}" href="${routeUrl('brief',symbol)}">${d?.updatedAt?'Open research':'Research company'} ↗</a></td></tr>`;}).join('')}</tbody></table></div><p class="small">Sample company selection. This preview does not display live quotes or run a market screen.</p></div>`;}
function surface(){return `${header()}${productTabs()}<main class="product-page"><div class="prototype-bar"><span>CONCEPT PREVIEW</span> Proposed entry placement in ${esc({overview:'Company overview',financials:'Financials',filings:'Filings',chart:'Supercharts / Notes',watchlist:'Watchlist',screener:'Stock screener'}[route.surface])}. Existing data and controls stay in the live product.</div>${({overview:overviewSurface,financials:financialsSurface,filings:filingsSurface,chart:chartSurface,watchlist:watchlistSurface,screener:watchlistSurface})[route.surface]()}</main>`;}
function render(){route=readRoute();if(!state.documents[route.symbol])state.documents[route.symbol]=newResearch(route.symbol);doc=state.documents[route.symbol];document.getElementById('root').innerHTML=(route.home?home():route.surface?surface():notebook())+'<div class="toast" id="toast" role="status" hidden></div><dialog id="editor-dialog" aria-labelledby="editor-title"></dialog>';document.title='TradingView — '+(route.home?'Research Pilot':route.surface?route.surface[0].toUpperCase()+route.surface.slice(1):sections.find(s=>s[0]===route.view)[1]);updateSaveStatus();if(matchMedia('(max-width:680px)').matches){document.querySelector('.sections .active')?.scrollIntoView({block:'nearest',inline:'center'});document.querySelector('.tabs .selected')?.scrollIntoView({block:'nearest',inline:'center'});}if(!route.home&&!route.surface&&route.view==='evidence'){const p=new URLSearchParams(location.search);if(p.has('capture')){const capture=p.get('capture');openEvidence(null,{capture,metric:p.get('metric'),period:p.get('period'),section:p.get('section')});}}}
function showModal(title,body,kind,id=null){modal={kind,id};const dialog=document.getElementById('editor-dialog');dialog.innerHTML=`<form id="editor-form"><div class="panel-head"><h2 id="editor-title">${esc(title)}</h2><button type="button" class="icon-button" data-action="close-modal" aria-label="Close editor">×</button></div>${body}<div class="modal-actions"><button type="button" data-action="close-modal">Cancel</button><button class="primary" type="submit">${id?'Save changes':'Add to research'}</button></div></form>`;dialog.showModal();dialog.querySelector('[required]')?.focus();}
function closeModal(){document.getElementById('editor-dialog')?.close();modal=null;const p=new URLSearchParams(location.search);if(p.has('capture')){['capture','metric','period','section'].forEach(k=>p.delete(k));history.replaceState({},'','?'+p.toString());}}
function openEvidence(id,context={}){const existing=doc.evidence.find(e=>e.id===id);const capture=context.capture||'manual';const sourceName={financials:'Financials',filings:'Filings',chart:'Supercharts',manual:'Manual record'}[capture]||'Manual record';const defaultMetric=context.metric||(capture==='financials'?'Total revenue':capture==='filings'?'Annual report · '+(context.section||'Risk factors'):capture==='chart'?'Chart observation':'');const value=existing||{observation:'',metric:defaultMetric,period:context.period||(capture==='financials'?'Q4 FY2026 vs Q4 FY2025':capture==='filings'?'FY2026':''),source:capture==='manual'?'':capture==='financials'&&defaultMetric==='Operating cash flow'?liveUrl(capture).replace('financials-income-statement/','financials-cash-flow/'):liveUrl(capture),sourceName,questionId:''};showModal(id?'Edit evidence':'Add evidence',`<p class="small">${doc.symbol} · Source context is retained. Enter the observation you want to keep.</p>${existing?.sample?'<div class="sample-note">This is illustrative sample content. Saving an edit keeps it labelled as sample.</div>':''}${textarea('Observation','observation',value.observation,'required rows="4" maxlength="8000" placeholder="A fact, a quoted statement or an observation…"')}${formField('Metric or document section','metric',value.metric,'text','maxlength="200"')}${formField('Period or comparison','period',value.period,'text','required maxlength="200"')}${formField('Source URL','source',value.source,'url','required placeholder="https://…"')}${formField('Source label','sourceName',value.sourceName,'text','maxlength="100"')}<label class="form-label">Linked question<select name="questionId">${questionOptions(value.questionId)}</select></label>`,'evidence',id);}
function openArgument(id,side='Supports'){const a=doc.arguments.find(a=>a.id===id)||{text:'',side,evidenceIds:[]};showModal(id?'Edit assessment':'Add assessment',`${textarea('Assessment or risk','text',a.text,'required rows="4" maxlength="8000"')}<label class="form-label">Type<select name="side">${['Supports','Challenges','Open issue','Risk','Alternative'].map(s=>selectedOption(s,s,a.side)).join('')}</select></label><fieldset class="evidence-picker"><legend>Linked evidence</legend>${doc.evidence.map(e=>`<label><input type="checkbox" name="evidenceIds" value="${e.id}" ${a.evidenceIds.includes(e.id)?'checked':''}><span>${esc(e.metric||'Observation')} <small>${esc(e.period)}${e.sample?' · sample':''}</small></span></label>`).join('')||'<p class="small">No records yet. This will remain an unlinked assumption.</p>'}</fieldset>`,'argument',id);}
function openQuestion(id){const q=doc.questions.find(q=>q.id===id);showModal(q?'Edit question':'Add question',formField('Research question','title',q?.title||'','text','required maxlength="300"'),'question',id);}
function removeRecord(kind,id){const field={evidence:'evidence',argument:'arguments',question:'questions'}[kind];const index=doc[field].findIndex(x=>x.id===id);if(index<0)return;const item=JSON.parse(JSON.stringify(doc[field][index]));const argumentIds=kind==='evidence'?doc.arguments.filter(a=>a.evidenceIds.includes(id)).map(a=>a.id):[];const evidenceIds=kind==='question'?doc.evidence.filter(e=>e.questionId===id).map(e=>e.id):[];doc[field].splice(index,1);if(kind==='evidence')doc.arguments.forEach(a=>a.evidenceIds=a.evidenceIds.filter(e=>e!==id));if(kind==='question')doc.evidence.forEach(e=>{if(e.questionId===id)e.questionId='';});undoAction={symbol:doc.symbol,field,index,item,argumentIds,evidenceIds};const ok=save();render();notify((kind==='question'?'Question':kind==='argument'?'Assessment':'Evidence')+' removed'+(ok?'':'. Storage unavailable'),true);}
function undoRemoval(){if(!undoAction)return;const u=undoAction;const target=state.documents[u.symbol];if(!target[u.field].some(x=>x.id===u.item.id))target[u.field].splice(Math.min(u.index,target[u.field].length),0,u.item);target.arguments.forEach(a=>{if(u.argumentIds.includes(a.id)&&!a.evidenceIds.includes(u.item.id))a.evidenceIds.push(u.item.id)});target.evidence.forEach(e=>{if(u.evidenceIds.includes(e.id)&&!e.questionId)e.questionId=u.item.id});target.updatedAt=new Date().toISOString();undoAction=null;const ok=writeState();render();notify(ok?'Removed item restored.':'Restored in memory. Export a copy to keep it.');}
function exportResearch(){const blob=new Blob([JSON.stringify({format:'tradingview-research-prototype',exportedAt:new Date().toISOString(),research:doc},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${doc.symbol}-research.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('Research exported. Sample labels and source links are included.');}
document.addEventListener('click',event=>{const action=event.target.closest('[data-action]');if(action){const name=action.dataset.action,id=action.dataset.id;if(name==='close-modal')closeModal();else if(name==='add-evidence')openEvidence();else if(name==='edit-evidence')openEvidence(id);else if(name==='remove-evidence')removeRecord('evidence',id);else if(name==='add-question')openQuestion();else if(name==='edit-question')openQuestion(id);else if(name==='remove-question')removeRecord('question',id);else if(name==='add-argument')openArgument();else if(name==='edit-argument')openArgument(id);else if(name==='remove-argument')removeRecord('argument',id);else if(name==='add-risk')openArgument(null,'Risk');else if(name==='export')exportResearch();else if(name==='save-thesis'){doc.revisionAt=new Date().toISOString();save();render();notify(storageAvailable?'Thesis saved on this device.':'Thesis is not saved. Export a copy.');}else if(name==='undo'&&undoAction){undoRemoval();}else if(name==='capture-financials'){const metric=document.getElementById('capture-metric').value;const period=document.getElementById('capture-period').value;go(captureUrl('financials')+'&metric='+encodeURIComponent(metric)+'&period='+encodeURIComponent(period));}else if(name==='capture-filings'){const period=document.getElementById('filing-period').value;const section=document.getElementById('filing-section').value;go(captureUrl('filings')+'&period='+encodeURIComponent(period)+'&section='+encodeURIComponent(section));}return;}
const anchor=event.target.closest('a');if(anchor&&!event.metaKey&&!event.ctrlKey&&!event.shiftKey&&!event.altKey&&event.button===0&&anchor.getAttribute('href')?.startsWith('?')&&!anchor.target){event.preventDefault();go(anchor.getAttribute('href'));return;}const products=document.querySelector('.products');if(products&&!products.contains(event.target))products.open=false;});
document.addEventListener('input',event=>{const field=event.target.dataset.model;if(field){doc[field]=event.target.value;save();}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='company-switch')go(route.surface?surfaceUrl(route.surface,el.value):routeUrl(route.view,el.value));if(el.dataset.model){doc[el.dataset.model]=el.value;save();if(el.dataset.model==='horizon'){render();document.querySelector('[data-model="customHorizon"]')?.focus();}}if(el.dataset.questionStatus){const q=doc.questions.find(q=>q.id===el.dataset.questionStatus);if(q){q.status=el.value;save();}}if(el.id==='evidence-filter'){document.getElementById('evidence-list').innerHTML=doc.evidence.filter(e=>!el.value||e.questionId===el.value).map(evidenceCard).join('')||'<div class="card empty-state">No evidence linked to this question.</div>';}});
document.addEventListener('submit',event=>{if(event.target.id!=='editor-form'||!modal)return;event.preventDefault();const f=new FormData(event.target);const data=Object.fromEntries(f.entries());const kind=modal.kind,id=modal.id;if(kind==='evidence'){const url=safeUrl(data.source);if(!data.observation?.trim()||!data.period?.trim()||!url){notify('Enter an observation, a period and an HTTP or HTTPS source URL.');return;}const old=doc.evidence.find(e=>e.id===id);const record={...old,id:id||uid(),observation:data.observation.trim(),metric:data.metric.trim(),period:data.period.trim(),source:url,sourceName:data.sourceName.trim(),questionId:data.questionId,sample:old?.sample||false,createdAt:old?.createdAt||new Date().toISOString()};if(old)doc.evidence[doc.evidence.indexOf(old)]=record;else doc.evidence.push(record);}else if(kind==='argument'){if(!data.text?.trim())return;const old=doc.arguments.find(a=>a.id===id);const record={...old,id:id||uid(),text:data.text.trim(),side:data.side,evidenceIds:f.getAll('evidenceIds'),sample:old?.sample||false};if(old)doc.arguments[doc.arguments.indexOf(old)]=record;else doc.arguments.push(record);}else if(kind==='question'){if(!data.title?.trim())return;const old=doc.questions.find(q=>q.id===id);if(old)old.title=data.title.trim();else doc.questions.push({id:uid(),title:data.title.trim(),status:'Open'});}closeModal();const ok=save();render();notify(ok?'Research updated and saved on this device.':'Research updated in memory. Storage unavailable; export a copy.');});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){const products=document.querySelector('.products');if(products?.open){products.open=false;document.querySelector('.menu-trigger').focus();}}});
document.addEventListener('cancel',event=>{if(event.target.id==='editor-dialog')closeModal();},true);
window.addEventListener('popstate',()=>{modal=null;render();});
render();
</script></body></html>
