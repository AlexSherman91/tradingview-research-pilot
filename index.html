<script>
const labels=['Research goal','Research plan','Facts and sources','Compare data','Arguments and risks','My conclusion'];
const params=new URLSearchParams(location.search);
const isHome=!params.has('step');
const requestedStep=Number(params.get('step'));
const step=Number.isFinite(requestedStep)?Math.max(1,Math.min(6,Math.trunc(requestedStep)||1)):1;
const source='<div class="source">Financials → Income statement · AAPL · Q4 FY2026 ↗</div>';
const screens=[
`<div class="cols"><div class="card"><span class="label">Company</span><div class="field">● &nbsp; AAPL · Apple Inc. <span class="small" style="float:right">NASDAQ</span></div><span class="label">What do you want to find out?</span><div class="field choice">How sustainable is the company’s growth?</div><span class="label">Research horizon</span><div class="options"><span class="option">One quarter</span><span class="option on">1–3 years</span><span class="option">Custom</span></div><div class="small">Your goal helps shape the research plan. You can update it as you go.</div></div><div class="card tinted"><h2>From question to reasoning</h2><div class="line"><div class="num">1</div><div>Choose what to investigate</div></div><div class="line"><div class="num">2</div><div>Collect evidence and arguments</div></div><div class="line"><div class="num">3</div><div>Draw your own conclusion</div></div><div class="info" style="margin-top:18px">The notebook structures your research. The decision is yours.</div></div></div>`,
`<div class="cols"><div class="card"><h2>Suggested plan</h2>${[['Revenue growth','Review several comparable periods'],['Profit and margins','Check whether growth translates into profit'],['Cash flow','Compare profit with operating cash flow'],['Growth drivers','Review the explanations in company reports'],['Risks and alternatives','Identify factors that could change your conclusion']].map(([a,b])=>`<div class="line"><div class="check">✓</div><div><strong>${a}</strong><div class="small">${b}</div></div></div>`).join('')}</div><div class="card tinted"><h2>One question, several tools</h2><div class="line"><div><strong>Financials</strong><div class="small">Financial metrics and comparable periods</div></div></div><div class="line"><div><strong>Filings</strong><div class="small">Company reports, explanations and risks</div></div></div><div class="line"><div><strong>Supercharts · optional</strong><div class="small">Explore trends on a chart</div></div></div><div class="info" style="margin-top:14px">Adapt the plan to your question. Completing more checks does not, by itself, make a conclusion stronger.</div></div></div>`,
`<div class="cols" style="grid-template-columns:1.3fr 1fr"><div><div class="toolrow"><span class="tool on">Financials</span><span class="tool">Filings ↗</span><span class="tool">Supercharts ↗</span></div><div class="screen"><div class="screenhead"><strong>AAPL · Income statement</strong><span class="badge">Quarterly</span></div><img src="assets/financials.jpg" alt="TradingView: Apple financial statements"></div><div class="demo">Original TradingView screen from the audit. Entries on the right illustrate the concept.</div></div><div class="card thin factsform"><h2>Add a fact manually</h2><span class="label">Observation</span><div class="field">Revenue increased versus the same quarter last year.</div><span class="label">Period</span><div class="field">Q4 FY2026 → Q4 FY2025</div><span class="label">Source</span><div class="field mini">tradingview.com/symbols/NASDAQ-AAPL/<br>financials-income-statement/</div><span class="label">What does this help investigate?</span><div class="field">Revenue growth</div><button class="primary" data-demo-action>Add to research</button></div></div>`,
`<div class="cols"><div class="card thin"><h2>Compare evidence</h2><table><tr><th>Research area</th><th>Observation</th><th>Status</th></tr><tr><td><strong>Revenue</strong></td><td>Growth versus the same quarter last year${source}</td><td><span class="pill">Fact added</span></td></tr><tr><td><strong>Profit and margins</strong></td><td>Compare with revenue growth</td><td><span class="pill warn">Not checked</span></td></tr><tr><td><strong>Cash flow</strong></td><td>Data for the same period needed</td><td><span class="pill warn">Not checked</span></td></tr></table><div class="info" style="margin-top:18px">Compare equivalent periods. Separate observations from explanations of their causes.</div></div><div class="card"><h2>Argument</h2><div class="field">Revenue growth supports the case for business growth, but its sustainability is not yet established.</div><span class="label">Which facts support this?</span><div class="evidence">Fact 1 · Revenue growth<br><span class="small">Q4 FY2026 → Q4 FY2025</span></div><span class="label">What still needs investigating?</span><div class="question">Do profit and cash flow support the growth story? What drivers does the company report?</div><div class="demo">Illustrative example, not a financial analysis of AAPL.</div></div></div>`,
`<div class="split"><div class="card pros"><h2>What supports my hypothesis?</h2><div class="field">Revenue increased versus the same quarter last year.</div><div class="evidence">Linked fact 1 · Financials<br><span class="small">Period and source link retained</span></div><button class="quiet" data-demo-action>+ Add an argument</button></div><div class="card cons"><h2>What could challenge it?</h2><div class="field">Growth may reflect a one-off factor. Check the explanations in the company report.</div><span class="label">What should I check next?</span><div class="field">Growth drivers, margins, operating cash flow and demand risks.</div><a class="button" href="https://www.tradingview.com/symbols/NASDAQ-AAPL/financials-filings/" target="_blank" rel="noopener">Open Filings ↗</a></div></div><div class="info" style="margin-top:18px">Consider an alternative: what evidence would make you reject your original hypothesis? A risk summary is already available in Filings.</div>`,
`<div class="cols"><div class="card"><div class="row" style="margin-top:0"><h2 style="margin:0">My conclusion</h2><span class="badge">Draft</span></div><div class="summaryhero">Revenue is growing, but the evidence collected so far is insufficient to conclude that growth is sustainable.</div><span class="label">Reasoning and limitations</span><div class="field">Revenue growth has been observed. Comparisons with profit and cash flow, and an assessment of growth drivers, are still incomplete.</div><span class="label">When will I revisit my conclusion?</span><div class="field">After reviewing cash flow and the explanations in the company report, then again after the next earnings release.</div><div class="footerline">This conclusion is written by the user. The notebook does not decide whether to buy or sell an asset.</div></div><div class="card tinted"><h2>Included in your research</h2><div class="line"><div>✓ &nbsp; Company, goal and time horizon</div></div><div class="line"><div>✓ &nbsp; Facts, periods and sources</div></div><div class="line"><div>✓ &nbsp; Arguments for and against</div></div><div class="line"><div>✓ &nbsp; Gaps and conditions for review</div></div><div class="question" style="margin-top:18px">Incomplete checks remain visible. Save a draft and continue your research later.</div><div class="demo">Illustrative conclusion for testing the workflow.</div></div></div>`
];

const icon=(name)=>{const paths={search:'<circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.2 16.2 4.4 4.4"/>',chevron:'<path d="m5 9 7 7 7-7"/>',globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5c4 2 10 2 14 0M5 17.5c4-2 10-2 14 0"/>',chart:'<path d="M3 20h18M5 16V9h4v7m3 4V5h4v15m3 0V2M3 7l6-4 5 2 7-4"/>',notebook:'<rect x="5" y="3" width="15" height="18" rx="2"/><path d="M9 3v18M3 7h4M3 12h4M3 17h4M12 8h5M12 12h5M12 16h3"/>',screener:'<path d="M3 5h18M5 12h14M8 19h8"/><circle cx="8" cy="5" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 11h18M7 15h3M14 15h3"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.notebook}</svg>`};
const logo='<svg width="36" height="28" viewBox="0 0 36 28" aria-hidden="true"><path d="M14 22H7V11H0V4h14v18zM28 22h-8l7.5-18h8L28 22z" fill="currentColor"/><circle cx="20" cy="8" r="4" fill="currentColor"/></svg>';
function header(){return `<header class="top"><a class="brand" href="?" aria-label="TradingView — home">${logo}TradingView</a><a class="search" href="https://www.tradingview.com/search/" aria-label="Search on TradingView">${icon('search')}<span>Search</span><kbd>⌘ K</kbd></a><nav class="mainnav" aria-label="Main navigation"><details class="products"><summary class="menu-trigger">Products ${icon('chevron')}</summary><div class="product-menu"><div class="menu-label">MARKET ANALYSIS</div><a class="product-item" href="https://www.tradingview.com/chart/" target="_blank" rel="noopener">${icon('chart')}<div><strong>Supercharts</strong><small>Charts and technical analysis tools</small></div></a><a class="product-item" href="https://www.tradingview.com/screener/" target="_blank" rel="noopener">${icon('screener')}<div><strong>Screeners</strong><small>Find and compare market instruments</small></div></a><a class="product-item" href="https://www.tradingview.com/economic-calendar/" target="_blank" rel="noopener">${icon('calendar')}<div><strong>Calendars</strong><small>Economic events and earnings</small></div></a><a class="product-item featured" href="?step=1">${icon('notebook')}<div><strong>Research notebook <span class="new">Pilot</span></strong><small>From a company question to your own conclusion</small></div></a></div></details><a class="navlink" href="https://www.tradingview.com/ideas/" target="_blank" rel="noopener">Community</a><a class="navlink" href="https://www.tradingview.com/markets/" target="_blank" rel="noopener">Markets</a><a class="navlink" href="https://www.tradingview.com/brokers/" target="_blank" rel="noopener">Brokers</a><a class="navlink" href="https://www.tradingview.com/about/" target="_blank" rel="noopener">More</a></nav><div class="header-end"><span class="language">${icon('globe')} EN</span><span class="avatar" aria-label="Demo profile">A</span><a class="button getstarted" href="https://www.tradingview.com/pricing/" target="_blank" rel="noopener"><span>Get started</span></a></div></header>`}
function home(){return `<div class="home">${header()}<main class="hero"><video class="earth" autoplay muted loop playsinline poster="https://static.tradingview.com/static/bundles/earth-blurred.0375ae5d4a11366fb585.webp" aria-hidden="true"><source src="https://static.tradingview.com/static/bundles/earth.avc1.f6a145c79bffd1ef7941.mp4" type="video/mp4"></video><h1>Where the world does markets</h1><p>Join 100 million traders and investors taking the future into their own hands.</p><a class="button hero-cta" href="https://www.tradingview.com/pricing/" target="_blank" rel="noopener"><span>Get started for free</span></a><p class="fine">$0 forever, no credit card needed</p><button class="entry-hint" id="entry-hint">New pilot: Products → Research notebook ↗</button><div class="home-note">DEMONSTRATION PROTOTYPE · NEW FEATURE CONCEPT</div></main></div>`}
function notebook(){return `${header()}<nav class="tabs" aria-label="Company navigation"><a href="https://www.tradingview.com/symbols/NASDAQ-AAPL/" target="_blank" rel="noopener">Overview</a><a href="https://www.tradingview.com/symbols/NASDAQ-AAPL/financials-overview/" target="_blank" rel="noopener">Financials</a><a href="https://www.tradingview.com/symbols/NASDAQ-AAPL/financials-filings/" target="_blank" rel="noopener">Filings</a><a href="https://www.tradingview.com/chart/?symbol=NASDAQ%3AAAPL" target="_blank" rel="noopener">Supercharts ↗</a><a class="selected" href="?step=${step}" aria-current="page">Research <span class="new">Pilot</span></a></nav><div class="workspace"><aside class="sidebar"><div class="eyebrow">MY RESEARCH</div><div class="research"><div class="company"><span class="company-icon">A</span><strong>AAPL · Apple Inc.</strong></div><div class="small">Sustainable growth<br>Horizon: 1–3 years</div></div><nav class="steps" aria-label="Research steps">${labels.map((x,i)=>`<a href="?step=${i+1}" class="step ${i+1===step?'active':i+1<step?'done':''}" ${i+1===step?'aria-current="step"':''} aria-label="${i+1}. ${x}"><span class="num">${i+1}</span><span class="step-label">${x}</span></a>`).join('')}</nav><div class="sidefoot small">Step ${step} of 6<div class="progress" aria-hidden="true"><span style="width:${step/6*100}%"></span></div><p>The plan guides your work.<br>You draw the conclusion.</p></div><div class="prototype-note">PILOT CONCEPT<br>New feature concept, not the current UI.<br>Illustrative data.</div></aside><main class="content"><nav class="crumb" aria-label="Breadcrumb"><a href="?">Home</a><span>›</span><a href="?step=1">Research</a><span>›</span><span>AAPL</span><span>›</span><span>${labels[step-1]}</span></nav><div class="head"><div><h1>${titles[step-1]}</h1><div class="subtitle">${subs[step-1]}</div></div><span class="tag">Illustrative example</span></div><div class="body">${screens[step-1]}</div><footer class="actions"><a class="button" href="${step===1?'?':'?step='+(step-1)}">${step===1?'Back to home':'← Back'}</a><span class="small action-state">${step} / 6</span>${step===6?'<button class="primary" data-demo-action>Save research</button>':`<a class="button primary" href="?step=${step+1}">${btns[step-1]}</a>`}</footer></main></div>`}
document.getElementById('root').innerHTML=(isHome?home():notebook())+'<div class="toast" role="status" hidden></div>';
document.title=isHome?'TradingView — Research Pilot':`TradingView — ${labels[step-1]} · Research`;
const products=document.querySelector('.products');
document.addEventListener('click',event=>{if(!products.contains(event.target))products.open=false;const action=event.target.closest('[data-demo-action]');if(action){const toast=document.querySelector('.toast');toast.textContent='This is a demonstration prototype. Editing and saving data are not available yet.';toast.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.hidden=true,4500)}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){products.open=false;document.querySelector('.menu-trigger').focus();}});
document.querySelector('#entry-hint')?.addEventListener('click',()=>{products.open=true;document.querySelector('.product-item.featured').focus()});
</script>
</body></html>
