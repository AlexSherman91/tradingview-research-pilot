<!doctype html><html lang="ru"><meta charset="utf-8"><title>TradingView — концепт исследовательской тетради</title>
<style>

<div id="root"></div><script>
const labels=['Цель исследования','План проверки','Факты и источники','Сопоставление данных','Аргументы и риски','Собственный вывод'];
let step=Math.max(1,Math.min(6,Number(new URLSearchParams(location.search).get('step'))||1));
const source='<div class="source">Financials → Income statement · AAPL · Q4 FY2026 ↗</div>';
const screens=[
`<div class="cols"><div class="card"><span class="label">Компания</span><div class="field">● &nbsp; AAPL · Apple Inc. <span class="small" style="float:right">NASDAQ</span></div><span class="label">Что хотите выяснить?</span><div class="field choice">Насколько устойчив рост компании?</div><span class="label">Горизонт исследования</span><div class="options"><span class="option">Квартал</span><span class="option on">1–3 года</span><span class="option">Свой</span></div><div class="small">Цель поможет подобрать план проверки. Её можно изменить в процессе.</div></div><div class="card tinted"><h2>От вопроса — к обоснованию</h2><div class="line"><div class="num">1</div><div>Выберите, что хотите проверить</div></div><div class="line"><div class="num">2</div><div>Соберите факты и аргументы</div></div><div class="line"><div class="num">3</div><div>Сформулируйте собственный вывод</div></div><div class="info" style="margin-top:18px">Тетрадь организует исследование. Решение остаётся за вами.</div></div></div>`,
`<div class="cols"><div class="card"><h2>Предлагаемый план</h2>${[['Динамика выручки','Проверить несколько сопоставимых периодов'],['Прибыль и маржа','Выяснить, превращается ли рост в прибыль'],['Денежный поток','Сопоставить прибыль с операционным потоком'],['Причины роста','Проверить объяснения в отчётах компании'],['Риски и альтернативы','Найти факторы, которые могут изменить вывод']].map(([a,b])=>`<div class="line"><div class="check">✓</div><div><strong>${a}</strong><div class="small">${b}</div></div></div>`).join('')}</div><div class="card tinted"><h2>Один вопрос, несколько инструментов</h2><div class="line"><div><strong>Financials</strong><div class="small">Показатели и сопоставимые периоды</div></div></div><div class="line"><div><strong>Filings</strong><div class="small">Отчёты, объяснения и риски</div></div></div><div class="line"><div><strong>Supercharts · при необходимости</strong><div class="small">Проверка динамики на графике</div></div></div><div class="info" style="margin-top:14px">Измените план под свой вопрос. Число выполненных пунктов само по себе не означает качественный вывод.</div></div></div>`,
`<div class="cols" style="grid-template-columns:1.3fr 1fr"><div><div class="toolrow"><span class="tool on">Financials</span><span class="tool">Filings ↗</span><span class="tool">Supercharts ↗</span></div><div class="screen"><div class="screenhead"><strong>AAPL · Income statement</strong><span class="badge">Quarterly</span></div><img src="assets/financials.jpg"></div><div class="demo">Исходный скрин TradingView из аудита. Записи справа — пример заполнения прототипа.</div></div><div class="card thin factsform"><h2>Добавить факт вручную</h2><span class="label">Наблюдение</span><div class="field">Выручка выросла относительно того же квартала прошлого года.</div><span class="label">Период</span><div class="field">Q4 FY2026 → Q4 FY2025</div><span class="label">Источник</span><div class="field mini">tradingview.com/symbols/NASDAQ-AAPL/<br>financials-income-statement/</div><span class="label">Что это помогает проверить?</span><div class="field">Динамику выручки</div><button class="primary">Добавить в исследование</button></div></div>`,
`<div class="cols"><div class="card thin"><h2>Сопоставление фактов</h2><table><tr><th>Проверка</th><th>Наблюдение</th><th>Статус</th></tr><tr><td><strong>Выручка</strong></td><td>Рост к тому же кварталу прошлого года${source}</td><td><span class="pill">Добавлен факт</span></td></tr><tr><td><strong>Прибыль и маржа</strong></td><td>Нужно сопоставить с динамикой выручки</td><td><span class="pill warn">Не проверено</span></td></tr><tr><td><strong>Денежный поток</strong></td><td>Нужны данные за тот же период</td><td><span class="pill warn">Не проверено</span></td></tr></table><div class="info" style="margin-top:18px">Сравнивайте одинаковые периоды. Отделяйте наблюдение от объяснения его причин.</div></div><div class="card"><h2>Аргумент</h2><div class="field">Рост выручки — аргумент в пользу роста бизнеса, но его устойчивость ещё не доказана.</div><span class="label">На каких фактах основан?</span><div class="evidence">Факт 1 · Динамика выручки<br><span class="small">Q4 FY2026 → Q4 FY2025</span></div><span class="label">Что осталось выяснить?</span><div class="question">Подтверждается ли рост прибылью и денежным потоком? Какие причины называет компания?</div><div class="demo">Демонстрационный пример, не финансовый анализ AAPL.</div></div></div>`,
`<div class="split"><div class="card pros"><h2>Что подтверждает мою версию?</h2><div class="field">Выручка выросла к тому же кварталу прошлого года.</div><div class="evidence">Связанный факт 1 · Financials<br><span class="small">Период и ссылка сохранены</span></div><button class="quiet">+ Добавить аргумент</button></div><div class="card cons"><h2>Что может ей противоречить?</h2><div class="field">Рост мог зависеть от разового фактора. Нужна проверка объяснений в отчёте.</div><span class="label">Что проверить дальше?</span><div class="field">Причины роста, маржу, операционный денежный поток и риски спроса.</div><button>Открыть Filings ↗</button></div></div><div class="info" style="margin-top:18px">Проверьте альтернативу: какие данные заставили бы вас отказаться от исходной версии? Резюме рисков уже доступно в Filings.</div>`,
`<div class="cols"><div class="card"><div class="row" style="margin-top:0"><h2 style="margin:0">Мой вывод</h2><span class="badge">Черновик</span></div><div class="summaryhero">Рост выручки наблюдается, но собранных данных пока недостаточно, чтобы считать его устойчивым.</div><span class="label">Основания и ограничения</span><div class="field">Есть факт роста выручки. Сопоставление с прибылью и денежным потоком, а также проверка причин роста ещё не завершены.</div><span class="label">Когда пересмотрю вывод?</span><div class="field">После проверки денежного потока и объяснений в отчёте; затем — после следующей отчётности.</div><div class="footerline">Вывод сформулирован пользователем. Тетрадь не определяет, покупать или продавать актив.</div></div><div class="card tinted"><h2>Сохранится в исследовании</h2><div class="line"><div>✓ &nbsp; Компания, цель и горизонт</div></div><div class="line"><div>✓ &nbsp; Факты, периоды и источники</div></div><div class="line"><div>✓ &nbsp; Аргументы за и против</div></div><div class="line"><div>✓ &nbsp; Пробелы и условия пересмотра</div></div><div class="question" style="margin-top:18px">Незавершённые проверки остаются видны. Можно сохранить черновик и продолжить исследование позже.</div><div class="demo">Демонстрационный вывод для проверки сценария.</div></div></div>`
];
const titles=['С чего начнём исследование?','Что нужно проверить?','Соберите факты с источниками','Свяжите данные с аргументами','Проверьте свою версию','Сформулируйте собственный вывод'];
const subs=['Выберите компанию, вопрос и горизонт.','План можно уточнить под свою задачу.','Переносите в тетрадь только значимые для вопроса наблюдения.','Проверьте сопоставимость периодов и отметьте пробелы.','Зафиксируйте подтверждения, альтернативы и риски.','Сохраните обоснование, ограничения и условия пересмотра.'];
const btns=['Выбрать план →','Перейти к фактам →','К сопоставлению →','Проверить объяснение →','Сформулировать вывод →','Сохранить исследование'];
document.getElementById('root').innerHTML=`<div class="top"><div class="brand">TradingView</div><div class="search">⌕ &nbsp; Поиск &nbsp; <span style="float:right">⌘ K</span></div><span>Продукты</span><span>Сообщество</span><span>Рынки</span><span class="proto">КОНЦЕПТ ПИЛОТА · НЕ ТЕКУЩИЙ UI</span><span class="avatar">А</span></div><div class="tabs"><span>Обзор</span><span>Financials</span><span>Filings</span><span>Supercharts</span><span class="selected">Исследования <span class="new">Пилот</span></span></div><div class="shell"><aside class="sidebar"><div class="eyebrow">МОЁ ИССЛЕДОВАНИЕ</div><div class="research"><strong>AAPL · Apple Inc.</strong><div class="small">Устойчивость роста<br>Горизонт: 1–3 года</div></div>${labels.map((x,i)=>`<a href="?step=${i+1}" class="step ${i+1===step?'active':i+1<step?'done':''}"><span class="num">${i+1}</span><span>${x}</span></a>`).join('')}<div class="sidefoot small">Шаг ${step} из 6<div class="progress"><span style="width:${step/6*100}%"></span></div><p>План направляет работу.<br>Вывод делаете вы.</p></div></aside><main class="content"><div class="crumb">Исследования &nbsp; / &nbsp; AAPL &nbsp; / &nbsp; ${labels[step-1]}</div><div class="head"><div><h1>${titles[step-1]}</h1><div class="subtitle">${subs[step-1]}</div></div><span class="tag">Демонстрационный пример</span></div><div class="body">${screens[step-1]}</div><div class="actions"><a href="?step=${Math.max(1,step-1)}"><button>${step===1?'Отмена':'← Назад'}</button></a><a href="?step=${Math.min(6,step+1)}"><button class="primary">${btns[step-1]}</button></a></div></main></div>`;
</script></html>
