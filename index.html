.lite-notebook{max-width:800px;margin:0 auto;padding:32px 24px 64px}
.lite-notebook .workspace-toolbar{margin-bottom:18px;gap:8px}
.lite-heading{padding:16px 0 28px}
.lite-heading h1{font-size:clamp(28px,4vw,38px);margin:0 0 18px}
.lite-companies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lite-company{display:flex;flex-direction:column;gap:4px;min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-decoration:none}
.lite-company strong{font-size:18px;line-height:1.2}
.lite-company span{font-size:13px;color:#5d606b;overflow-wrap:anywhere}
.lite-company:hover{border-color:#9598a1}
.lite-company[aria-current=page]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#f2f5ff}
.lite-company[aria-current=page] strong{color:var(--blue)}
.lite-section{padding:20px 0;border-top:1px solid var(--line)}
.lite-section h2,.lite-section label{margin-top:0}
.lite-section h2{margin-bottom:0}
.lite-section textarea{resize:vertical}
.lite-date{max-width:205px}
.lite-date .form-label{margin-bottom:0}
.lite-menu{position:relative}
.lite-menu summary,.lite-source summary{cursor:pointer}
.lite-menu summary{display:block;list-style:none;border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:20px;color:var(--ink)}
.lite-menu button{position:absolute;right:0;top:calc(100% + 4px);background:white;border:1px solid var(--line);white-space:nowrap;z-index:1}
.lite-record{border-bottom:1px solid var(--line);padding:10px 0 14px}
.lite-record .panel-head{justify-content:space-between}
.lite-record .record-text{margin:4px 0 8px}
.lite-actions,.lite-meta{display:flex;align-items:center;gap:8px}
.lite-meta:empty{display:none}
.lite-source{margin:12px 0;color:var(--muted)}
.lite-source .form-label{margin-top:10px}
.lite-capture-context{margin-top:8px}

.research-summary p{line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}

.research-panel #panel-editor h2{font-size:20px}
.research-panel .lite-source .form-label{margin-top:12px}
.research-panel .research-view .record-text{font-size:14px}
.research-panel .research-view .lite-record .icon-button{font-size:11px}

.quality-notice{margin:18px 0;padding:12px 14px;background:#fffaf0;border:1px solid #efce92;border-radius:6px;font-size:12px;color:#72501b}
.quality-notice p{margin:6px 0;line-height:1.5}
.quality-fix{display:block;border:0;background:transparent;color:#72501b;padding:6px 0;text-align:left;font-size:12px;white-space:normal;height:auto;line-height:1.5}

.comparison-notice{font-size:12px;line-height:1.5;color:#72501b;background:#fffaf0;border-radius:4px;padding:10px}

.version-evidence{border-bottom:1px solid #e0e3eb;margin:12px 0;padding:0 0 12px;font-size:12px}
.version-evidence strong{display:block;margin:6px 0}
.version-evidence a{font-size:11px}
.version-evidence .quality-gap{margin:6px 0 0}
.version-save{padding:18px 0;border-top:1px solid #e0e3eb}
.version-save>.primary{margin-top:16px}
.version-save>.small{line-height:1.5;font-size:11px;color:#787b86}
.saved-version{padding:14px 0;border-bottom:1px solid #e0e3eb}
.research-panel .comparison-picker input{padding:0}
.research-panel .comparison-table .text-link{font-size:12px}

</span></a></nav><div class="header-end"><span class="language">${icon('globe')} EN</span><span class="avatar" aria-label="Demo profile">A</span><a class="button getstarted" href="https://www.tradingview.com/pricing/" target="_blank" rel="noopener"><span>Get started</span></a></div></header>`;}

function companyPicker(){

function sourceReturn(){const from=new URLSearchParams(location.search).get('from');const names={chart:'Supercharts',financials:'Financials',filings:'Filings',overview:'Company overview',watchlist:'Watchlist',screener:'Screener',community:'Community',markets:'Markets'};return names[from]?`<a class="source-return" href="${surfaceUrl(from,'AAPL')+(from==='financials'&&new URLSearchParams(location.search).get('fromDetail')==='statement'?'&detail=statement':'')}">← ${names[from]}</a><span>·</span>`:'';}
function evidenceGaps(record){
  const gaps=[];
  if(!record.period?.trim())gaps.push('Period missing');

function evidenceChanges(version){
  const previous=new Map(version.evidence.map(record=>[record.id,record]));

}else if(name==='close-research'){go(panelUrl(false));document.getElementById('rail-research-trigger')?.focus();}
else if(name==='collapse-research'){go(panelUrl(true,!route.collapsed));document.querySelector('[data-action="collapse-research"]')?.focus();}
else if(name==='outline-entry'){const active=document.querySelector('.reference-stage')?.classList.toggle('show-entry');action.setAttribute('aria-pressed',String(Boolean(active)));}else if(name==='close-modal')closeModal();else if(name==='add-evidence'){
  if(route.panel){
    const key=route.surface==='financials'&&new URLSearchParams(location.search).get('detail')==='statement'?'statement':route.surface;
    openEvidence(null,referenceScenes[key].entry);
  }else openEvidence();
}else if(name==='edit-evidence')openEvidence(id);else if(name==='remove-evidence')removeRecord('evidence',id);else if(name==='add-question')openQuestion();
else if(name==='edit-question')openQuestion(id);
else if(name==='remove-question')removeRecord('question',id);
else if(name==='add-argument')openArgument();
else if(name==='compare-argument')openArgument(null,'Supports',doc.evidence.filter(record=>doc.comparisonIds.includes(record.id)).map(record=>record.id));
else if(name==='save-thesis-version')saveThesisVersion();
else if(name==='add-risk')openArgument(null,'Risk');
else if(name==='edit-argument')openArgument(id);
else if(name==='remove-argument')removeRecord('argument',id);
else if(name==='suggest-checks'){
  ['Revenue growth','Profit and margins','Cash flow','Growth drivers','Demand and execution risks'].forEach(title=>{
    if(!doc.questions.some(question=>question.title===title))doc.questions.push({id:uid(),title,status:'Open'});
  });
  const ok=save();render();notify(ok?'Suggested checks added.':'Checks added in memory. Export a copy.');
}else if(name==='export')exportResearch();else if(name==='undo'&&undoAction){undoRemoval();}return;}
const anchor=event.target.closest('a');if(anchor&&!event.metaKey&&!event.ctrlKey&&!event.shiftKey&&!event.altKey&&event.button===0&&anchor.getAttribute('href')?.startsWith('?')&&!anchor.target){event.preventDefault();go(anchor.getAttribute('href'));return;}const products=document.querySelector('.products');if(products&&!products.contains(event.target))products.open=false;});
document.addEventListener('input',event=>{const field=event.target.dataset.model;if(field){
  doc[field]=event.target.value;save();
  if(['thesis','limitations','invalidation','reviewDate'].includes(field)){
    const preview=document.getElementById('thesis-review-preview');
    if(preview)preview.innerHTML=changeReview();
  }
}});
document.addEventListener('change',event=>{
  const field=event.target;
  if(field.dataset.compareId){
    const id=field.dataset.compareId;
    doc.comparisonIds=doc.comparisonIds.filter(value=>value!==id);
    if(field.checked)doc.comparisonIds.push(id);
    const ok=save();render();
    document.querySelector('[data-compare-id="'+CSS.escape(id)+'"]')?.focus();
    if(!ok)notify('Comparison kept in memory. Export a copy.');
  }
  if(field.dataset.reviewEvidenceId){
    const id=field.dataset.reviewEvidenceId;
    doc.reviewEvidenceIds=doc.reviewEvidenceIds.filter(value=>value!==id);
    if(field.checked)doc.reviewEvidenceIds.push(id);
    save();
  }
  if(field.dataset.questionStatus){
    const question=doc.questions.find(item=>item.id===field.dataset.questionStatus);
    if(question){question.status=field.value;save();}
  }
  if(field.type==='date'&&field.dataset.model){doc[field.dataset.model]=field.value;save();}
});
document.addEventListener('submit',event=>{
  if(event.target.id!=='editor-form'||!modal)return;
  event.preventDefault();
  const form=event.target;
  const data=Object.fromEntries(new FormData(form));
  if(modal.kind==='question'||modal.kind==='argument'){
    const value=(modal.kind==='question'?data.title:data.text).trim();
    if(!value){notify('Enter text before saving.');return;}
    if(modal.kind==='question'){
      const old=doc.questions.find(item=>item.id===modal.id);
      if(old)old.title=value;
      else doc.questions.push({id:uid(),title:value,status:'Open'});
    }else{
      const old=doc.arguments.find(item=>item.id===modal.id);
      const record={...old,id:modal.id||uid(),text:value,side:data.side,evidenceIds:new FormData(form).getAll('evidenceIds')};
      if(old)doc.arguments[doc.arguments.indexOf(old)]=record;
      else doc.arguments.push(record);
    }
    closeModal();const ok=save();render();notify(ok?'Research saved.':'Saved in memory. Export a copy.');return;
  }
  const url=safeUrl(data.source);
  const observation=data.observation.trim();
  const sourceInput=form.elements.source;
  const observationInput=form.elements.observation;
  if(!observation){
    observationInput.setCustomValidity('Enter an observation.');
    observationInput.addEventListener('input',()=>observationInput.setCustomValidity(''),{once:true});
    observationInput.reportValidity();return;
  }
  if(data.source.trim()&&!url){
    sourceInput.closest('details').open=true;
    sourceInput.setCustomValidity('Use an HTTP or HTTPS source URL.');
    sourceInput.addEventListener('input',()=>sourceInput.setCustomValidity(''),{once:true});
    sourceInput.reportValidity();return;
  }
  const {id,sourceName,returnToSource}=modal;
  const index=doc.evidence.findIndex(record=>record.id===id);
  const old=doc.evidence[index];
  const record={...old,id:id||uid(),observation,stance:data.stance,metric:data.metric.trim(),
    period:data.period.trim(),questionId:data.questionId||'',source:url,sourceName,createdAt:old?.createdAt||new Date().toISOString()};
  if(old)doc.evidence[index]=record;
  else doc.evidence.push(record);
  closeModal();
  const ok=save();
  if(ok&&returnToSource)go(surfaceUrl('community'),true);
  else render();
  notify(ok?'Observation saved.':'Saved in memory. Storage unavailable; export a copy.');
});
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape')return;
  if(modal){closeModal();return;}
  if(route.panel){go(panelUrl(false));document.getElementById('rail-research-trigger')?.focus();return;}
  const products=document.querySelector('.products');
  if(products?.open){products.open=false;document.querySelector('.menu-trigger').focus();}
});
document.addEventListener('cancel',event=>{if(event.target.id==='editor-dialog')closeModal();},true);
window.addEventListener('popstate',()=>{modal=null;render();});
render();
</script></body></html>
